name: Sync release to CNB

on:
  push:
    branches: [codex/cnb-download-speed-test]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub release tag to mirror (empty = latest stable)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-cnb-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror release and publish verified update manifest
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "0.6.3"
        run: python scripts/release/sync-cnb-release.py
